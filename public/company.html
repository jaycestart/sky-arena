<!doctype html>
<meta charset="utf-8">
<title>SKY ARENA — AI 회사</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  AI 회사 현황판 v2. 지난 판의 실수를 고쳤다: 근무표(계획)를 보여주면서
  실제로는 아무도 일하지 않는데 "26명 근무" 라고 표시했다. 이번엔
  **GitHub 에서 실제 실행 기록을 읽어서만** 그린다 — 여기 보이는 팀은
  전부 진짜로 돌았고, 결과(초록/빨강)도 진짜다.
  서버 불필요: 공개 저장소라 GitHub API 를 브라우저가 직접 읽는다.
  비로그인 API 는 시간당 60회 제한이라 5분마다만 갱신한다(회당 4요청).
-->
<style>
  :root {
    --panel:rgba(14,20,32,.72); --line:rgba(120,150,200,.18); --txt:#eaf1fb;
    --dim:#93a3bd; --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --acc:#7dd3fc;
  }
  * { box-sizing:border-box }
  body {
    margin:0; color:var(--txt); min-height:100vh;
    font:14px/1.6 "Malgun Gothic","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(120% 80% at 78% -10%, rgba(255,214,170,.30), transparent 55%),
      radial-gradient(90% 60% at 10% 8%, rgba(125,211,252,.14), transparent 60%),
      linear-gradient(180deg,#050a16 0%,#0a1428 18%,#12294a 38%,
        #1d4470 58%,#2d6591 74%,#4d8fae 88%,#7fb8c9 100%);
    background-attachment:fixed;
  }
  body::before, body::after {
    content:''; position:fixed; inset:-20% -50%; pointer-events:none; z-index:0;
  }
  body::before {
    background:
      radial-gradient(38% 14% at 20% 62%, rgba(255,255,255,.16), transparent 70%),
      radial-gradient(30% 11% at 62% 71%, rgba(255,255,255,.13), transparent 70%),
      radial-gradient(44% 13% at 88% 58%, rgba(255,255,255,.10), transparent 70%);
    animation:drift 180s linear infinite;
  }
  body::after {
    background:
      radial-gradient(26% 9% at 40% 84%, rgba(255,255,255,.10), transparent 70%),
      radial-gradient(34% 10% at 78% 90%, rgba(255,255,255,.08), transparent 70%);
    animation:drift 320s linear infinite reverse;
  }
  @keyframes drift { from { transform:translateX(-6%) } to { transform:translateX(6%) } }
  @media (prefers-reduced-motion:reduce) { body::before, body::after { animation:none } }
  header, .wrap, footer { position:relative; z-index:1 }
  header { padding:20px 24px 14px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap }
  h1 { margin:0; font-size:19px; letter-spacing:-.3px }
  .sub { color:var(--dim); font-size:12px }
  .wrap { padding:20px 24px; max-width:1100px; margin:0 auto }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)) }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:16px; backdrop-filter:blur(14px) saturate(1.2);
          -webkit-backdrop-filter:blur(14px) saturate(1.2);
          box-shadow:0 8px 32px rgba(0,10,30,.35) }
  .card h2 { margin:0 0 12px; font-size:13px; color:var(--dim); font-weight:700;
             letter-spacing:.4px; text-transform:uppercase }
  .row { display:flex; gap:10px; align-items:flex-start; padding:8px 0;
         border-top:1px solid var(--line) }
  .row:first-of-type { border-top:0 }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; margin-top:7px }
  .t { flex:1; min-width:0 }
  .t a { color:var(--txt); text-decoration:none }
  .t a:hover { color:var(--acc); text-decoration:underline }
  .meta { color:var(--dim); font-size:12px }
  .big { font-size:30px; font-weight:800; letter-spacing:-1px }
  .empty { color:var(--dim); padding:10px 0; font-size:13px }
  a.btn { display:inline-block; margin-top:12px; color:var(--acc);
          text-decoration:none; font-size:13px }
  a.btn:hover { text-decoration:underline }
  footer { padding:0 24px 30px; color:var(--dim); font-size:12px; max-width:1100px; margin:0 auto }
</style>

<header>
  <h1>SKY ARENA — AI 회사</h1>
  <span class="sub" id="clock"></span>
  <span class="sub" style="margin-left:auto">
    <a class="btn" href="https://github.com/jaycestart/sky-arena/actions" target="_blank">근무 기록 전체 →</a>
  </span>
</header>

<div class="wrap">
  <div class="grid">
    <div class="card">
      <h2>직원 — 실제 근무 기록</h2>
      <div class="big" id="staffCount">–</div>
      <div class="meta">아래는 계획표가 아니라 <b>실제로 돈 기록</b>입니다</div>
      <div style="margin-top:12px" id="staff"></div>
    </div>

    <div class="card">
      <h2>보고서 · 경고 (이슈)</h2>
      <div class="big" id="issueCount">–</div>
      <div class="meta">팀들이 올린 것 — 클릭해서 읽으세요</div>
      <div style="margin-top:12px" id="issues"></div>
    </div>

    <div class="card">
      <h2>결재 대기 (열린 PR)</h2>
      <div class="big" id="prCount">–</div>
      <div class="meta">Merge 를 눌러야 게임에 반영됩니다</div>
      <div style="margin-top:12px" id="prs"></div>
    </div>
  </div>

  <div class="grid" style="margin-top:14px">
    <div class="card" style="grid-column:1/-1">
      <h2>최근 작업 (커밋)</h2>
      <div id="commits"></div>
    </div>
  </div>
</div>

<footer>
  게임 <a class="btn" href="https://sky-arena-kg67.onrender.com" target="_blank">sky-arena-kg67.onrender.com</a>
  · 저장소 <a class="btn" href="https://github.com/jaycestart/sky-arena" target="_blank">jaycestart/sky-arena</a>
  <div style="margin-top:6px">5분마다 자동 갱신 · GitHub 공개 API 를 직접 읽으므로 서버가 필요 없습니다</div>
</footer>

<script>
const API = 'https://api.github.com/repos/jaycestart/sky-arena';
const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function ago(iso) {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + '분 전';
  if (m < 1440) return Math.round(m / 60) + '시간 전';
  return Math.round(m / 1440) + '일 전';
}
function row(color, html, meta) {
  return `<div class="row"><div class="dot" style="background:${color}"></div>
    <div class="t">${html}${meta ? `<div class="meta">${meta}</div>` : ''}</div></div>`;
}
async function get(path) {
  const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.json();
}

// 워크플로 이름 → 사람이 읽는 직함. 여기 없는 이름이 나와도 그대로 보여준다.
const TITLES = {
  '검증': '검사원 3명 (문법·정합성·봇 전투)',
  '측정원': '측정원 (매 커밋 + 매일 21:00)',
  '버그 사냥꾼': '버그 사냥꾼 (극단 상황, 매일 21:10)',
  '밸런스 검사원': '밸런스 검사원 (매일 21:15)',
  '성능 감시원': '성능 감시원 (매일 21:20)',
  '비서': '비서 (일일보고, 매일 21:40)',
  'keep-alive': null,      // 인프라 — 직원 목록에서 뺀다
  '일일보고': null,        // 철거된 옛 워크플로 잔재
};

async function load() {
  el('clock').textContent = new Date().toLocaleString('ko-KR');

  // 실제 실행 기록에서 직원 목록을 만든다 (요청 1회)
  try {
    const runs = (await get('/actions/runs?per_page=40')).workflow_runs || [];
    const latest = new Map();
    for (const r of runs) if (!latest.has(r.name)) latest.set(r.name, r);
    const staff = [...latest.values()]
      .filter((r) => TITLES[r.name] !== null)
      .sort((a, b) => (b.created_at > a.created_at ? 1 : -1));
    el('staffCount').textContent = staff.length + '팀';
    el('staff').innerHTML = staff.length ? staff.map((r) => {
      const c = r.status !== 'completed' ? '#fbbf24'
              : r.conclusion === 'success' ? '#4ade80' : '#fb7185';
      const state = r.status !== 'completed' ? '근무 중'
                  : r.conclusion === 'success' ? '정상' : '실패';
      return row(c, `<a href="${r.html_url}" target="_blank">${esc(TITLES[r.name] || r.name)}</a>`,
                 `${state} · ${ago(r.created_at)}`);
    }).join('') : '<div class="empty">아직 실행 기록이 없습니다</div>';
  } catch (e) { el('staff').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

  // 이슈 = 보고서·경고 (요청 1회)
  try {
    const iss = (await get('/issues?state=open&per_page=15'))
      .filter((i) => !i.pull_request);
    el('issueCount').textContent = iss.length;
    el('issues').innerHTML = iss.length ? iss.map((i) => {
      const lb = (i.labels || []).map((l) => l.name);
      const c = lb.includes('bughunt') ? '#fb7185'
              : lb.includes('perf') || lb.includes('balance') ? '#fbbf24' : '#4ade80';
      return row(c, `<a href="${i.html_url}" target="_blank">${esc(i.title)}</a>`, ago(i.created_at));
    }).join('') : '<div class="empty">열린 보고서가 없습니다. 매일 21:40 비서가 올립니다.</div>';
  } catch (e) { el('issues').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

  // 열린 PR (요청 1회)
  try {
    const prs = await get('/pulls?state=open&per_page=10');
    el('prCount').textContent = prs.length;
    el('prs').innerHTML = prs.length ? prs.map((p) =>
      row('#7dd3fc', `<a href="${p.html_url}" target="_blank">${esc(p.title)}</a>`, ago(p.created_at)))
      .join('') : '<div class="empty">없습니다</div>';
  } catch (e) { el('prs').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

  // 최근 커밋 (요청 1회)
  try {
    const cs = await get('/commits?per_page=8');
    el('commits').innerHTML = cs.map((c) =>
      row('#93a3bd', `<a href="${c.html_url}" target="_blank">${esc(c.commit.message.split('\n')[0])}</a>`,
          ago(c.commit.author.date))).join('');
  } catch (e) { el('commits').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

load();
setInterval(load, 300000);   // 5분 — 비로그인 API 한도(시간당 60회) 안
</script>
