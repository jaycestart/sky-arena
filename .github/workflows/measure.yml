# 측정원 — AI 회사의 첫 직원. 매 커밋과 매일 한 번 게임을 재고 보고한다.
#
# 왜 여기냐: 한 번 만들었던 회사가 산출물 0 건으로 실패했고, 진짜 원인은
# **직원 안에서 무슨 일이 나는지 볼 수 없었다**는 것이었다. 원인을 네 번
# 추측하고 네 번 틀렸다. 그래서 이번엔 로그를 읽을 수 있는 곳에만 짓는다.
# 같은 저장소에서 검사원 3명이 이미 8/8 통과로 돌고 있고, 로그도 산출물도
# API 로 확인된다.
#
# 이슈 정책 — 매 커밋마다 이슈를 만들면 금방 쓰레기가 된다.
#   매 커밋   : 측정하고 **작업 요약**에만 남긴다 (Actions 화면)
#   이상 발견 : 이슈를 만든다
#   매일 21시 : 이상이 없어도 정기 보고 이슈를 만든다
name: 측정원

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"      # 21:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  measure:
    name: 게임 상태 측정
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 봇 6기로 60초 돌려 잰다
        run: |
          cd server
          python - <<'PY'
          import math, random, time
          random.seed(7)
          import game

          w = game.World("measure")
          dt = 1 / 50
          launches = booms = 0
          max_pit = max_bnk = 0.0
          t0 = time.perf_counter()
          for _ in range(3000):                      # 60초
              w.step(dt)
              for e in w.events:
                  if e.get("e") == "launch": launches += 1
                  if e.get("e") == "boom":   booms += 1
              w.events.clear()
              for p in w.planes.values():
                  if p.alive:
                      max_pit = max(max_pit, abs(math.degrees(p.pit)))
                      max_bnk = max(max_bnk, abs(math.degrees(p.bnk)))
          wall = time.perf_counter() - t0

          n = len(w.planes)
          kills = sum(p.kills for p in w.planes.values())
          deaths = sum(p.deaths for p in w.planes.values())
          alive = sum(1 for p in w.planes.values() if p.alive)
          cap = n * (1 / game.WEAPONS[0]["cd"] + 1 / game.WEAPONS[1]["cd"])
          rate = launches / 60
          ac = game.AIRCRAFT["falcon"]

          # 여기 적힌 것은 전부 **실제로 났던 문제**다. 한 번도 안 난 일을
          # 예방하는 검사는 유지비만 든다.
          bad = []
          if deaths > kills + 3:
              bad.append(f"사망({deaths})이 격추({kills})보다 많다 — 추락·전장 이탈 의심")
          if kills == 0:      bad.append("60초 동안 격추 0회 — 무기나 조준이 죽었다")
          if launches == 0:   bad.append("아무도 발사하지 않는다")
          if rate > cap * 1.5:
              bad.append(f"발사가 이론 최대의 {rate/cap:.1f}배 — 쿨다운이 샌다")
          if max_bnk > 1.0:
              bad.append(f"봇이 저절로 비틀린다({max_bnk:.1f}도) — 자세 모델 누수")
          if max_pit < 30:    bad.append("수직 기동 실종 — 옛 원반 선회로 회귀")
          if alive == 0:      bad.append("전멸 — 재출격 고장")

          L = ["## 게임 상태", "",
               "봇 6기로 60초를 돌려 잰 값이다. 추정이 아니라 실측이다.", "",
               "| 항목 | 값 | 정상 |", "|---|---|---|",
               f"| 격추 / 사망 | {kills} / {deaths} | 비슷해야 함 |",
               f"| 생존 | {alive} / {n}기 | 0 이면 재출격 고장 |",
               f"| 발사 | 초당 {rate:.1f}발 | 이론 최대 {cap:.1f}발 |",
               f"| 폭발 | {booms}회 | — |",
               f"| 기수각 최대 | {max_pit:.0f}° | 30° 이상 |",
               f"| 비틀기 최대 | {max_bnk:.2f}° | **0** |",
               f"| 60초 시뮬 소요 | {wall:.1f}초 | 서버 여유 |",
               "", "## 현재 설정", "",
               f"- 기체 배율 **{ac['mscale']}배** · 피격 반경 **{game.CFG['planeR']}m**",
               f"- 회전율 피치 {math.degrees(ac['pitchRate']):.0f}°/s · "
               f"요 {math.degrees(ac['yawRate']):.0f}° · 롤 {math.degrees(ac['rollRate']):.0f}°",
               f"- {game.WEAPONS[0]['label']} 피해 {game.WEAPONS[0]['dmg']} / "
               f"{game.WEAPONS[1]['label']} 피해 {game.WEAPONS[1]['dmg']}",
               "", "## 이상 징후", ""]
          L += [f"- ⚠️ {b}" for b in bad] if bad else ["없음. 모든 값이 정상 범위다."]

          body = "\n".join(L)
          print(body)
          with open("/tmp/report.md", "w", encoding="utf-8") as f:
              f.write(body)
          with open("/tmp/anomalies", "w") as f:
              f.write(str(len(bad)))
          PY
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 이상이 있거나 정기 보고일 때만 이슈를 올린다
        run: |
          N=$(cat /tmp/anomalies)
          WHY=""
          [ "$N" -gt 0 ] && WHY="이상 ${N}건"
          [ "${{ github.event_name }}" != "push" ] && WHY="정기 보고"
          if [ -z "$WHY" ]; then
            echo "이상 없음 + 커밋 트리거 → 이슈 없이 요약에만 남긴다"
            exit 0
          fi
          {
            echo
            echo "---"
            echo
            echo "커밋 \`${GITHUB_SHA:0:7}\`"
            echo
            echo "*측정원이 자동 생성. 매 커밋과 매일 21:00(KST)에 돕니다.*"
          } >> /tmp/report.md
          gh label create measure --color 1D76DB --description "측정원 보고" 2>/dev/null || true
          gh issue create \
            --title "측정 보고 ($WHY) — $(TZ=Asia/Seoul date '+%m-%d %H:%M')" \
            --label measure \
            --body-file /tmp/report.md
        env:
          GH_TOKEN: ${{ github.token }}
