# 측정원 — 게임이 지금 어떤 상태인지 숫자로 재는 직원입니다.
#
# 출근 시각을 cron 에만 맡기지 않습니다. GitHub 무료 계정의 cron 은 크게
# 지연되거나 통째로 걸러지는 일이 잦아서, 처음 배치한 날 21:00 정기 근무가
# 한 번도 돌지 않았습니다. 그래서 안정적으로 도는 keep-alive 가 끝날 때마다
# 같이 깨어나도록 했습니다. 하루에 예닐곱 번 도는데, 공개 저장소는 실행
# 시간이 무료라 부담이 없습니다.
#
# 보고 방식: 평소에는 Actions 요약 화면에만 남기고, 이상이 있을 때만 이슈를
# 올립니다. 하루 결산은 비서가 따로 합니다.
name: 측정원

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["keep-alive"]
    types: [completed]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  measure:
    name: 게임 상태 측정
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 봇 6대로 60초 전투를 돌려 잰다
        run: |
          cd server
          python - <<'PY'
          import math, random, time
          random.seed(7)
          import game

          w = game.World("measure")
          dt = 1 / 50
          launches = booms = 0
          max_pit = max_bnk = 0.0
          t0 = time.perf_counter()
          for _ in range(3000):                      # 60초
              w.step(dt)
              for e in w.events:
                  if e.get("e") == "launch": launches += 1
                  if e.get("e") == "boom":   booms += 1
              w.events.clear()
              for p in w.planes.values():
                  if p.alive:
                      max_pit = max(max_pit, abs(math.degrees(p.pit)))
                      max_bnk = max(max_bnk, abs(math.degrees(p.bnk)))
          wall = time.perf_counter() - t0

          n = len(w.planes)
          kills = sum(p.kills for p in w.planes.values())
          deaths = sum(p.deaths for p in w.planes.values())
          alive = sum(1 for p in w.planes.values() if p.alive)
          cap = n * (1 / game.WEAPONS[0]["cd"] + 1 / game.WEAPONS[1]["cd"])
          rate = launches / 60
          ac = game.AIRCRAFT["falcon"]

          # 여기서 걸러내는 것은 전부 이 게임에서 실제로 났던 문제들입니다.
          # 한 번도 난 적 없는 일을 미리 막는 검사는 관리 비용만 늘어납니다.
          bad = []
          if deaths > kills + 3:
              bad.append(f"격추는 {kills}번인데 사망이 {deaths}번입니다. "
                         f"서로 쏴서 죽은 것보다 혼자 추락하거나 전장 밖으로 나간 경우가 더 많다는 뜻입니다.")
          if kills == 0:
              bad.append("60초 동안 아무도 격추되지 않았습니다. 무기가 안 나가거나 조준이 빗나가고 있습니다.")
          if launches == 0:
              bad.append("60초 동안 아무도 발사하지 않았습니다.")
          if rate > cap * 1.5:
              bad.append(f"초당 {rate:.1f}발이 나갔습니다. 재장전 시간을 지키면 최대 {cap:.1f}발이어야 하는데 "
                         f"{rate/cap:.1f}배나 됩니다. 재장전 대기가 제대로 걸리지 않고 있습니다.")
          if max_bnk > 1.0:
              bad.append(f"조종하지 않았는데도 기체가 최대 {max_bnk:.1f}도 기울었습니다. "
                         f"비틀림이 저절로 생기면 안 됩니다.")
          if max_pit < 30:
              bad.append("기수를 30도 이상 들어올린 적이 한 번도 없습니다. "
                         "위아래로 못 움직이고 평면에서만 도는 옛 상태로 돌아간 것 같습니다.")
          if alive == 0:
              bad.append("60초 뒤 살아남은 기체가 하나도 없습니다. 죽은 뒤 다시 나오는 기능이 멈췄습니다.")

          L = ["## 게임 상태", "",
               "봇 6대를 붙여놓고 60초 동안 실제로 전투를 시킨 뒤 잰 값입니다. 추정치가 아닙니다.", "",
               "| 항목 | 측정값 | 정상 기준 |", "|---|---|---|",
               f"| 격추 / 사망 | {kills}번 / {deaths}번 | 두 수가 비슷해야 정상입니다 |",
               f"| 살아남은 기체 | {n}대 중 {alive}대 | 0대면 재출격이 고장난 것입니다 |",
               f"| 발사 속도 | 초당 {rate:.1f}발 | 재장전을 지키면 최대 {cap:.1f}발입니다 |",
               f"| 폭발 | {booms}번 | — |",
               f"| 기수를 들어올린 최대 각도 | {max_pit:.0f}도 | 30도는 넘어야 위아래로 싸운 것입니다 |",
               f"| 저절로 기울어진 최대 각도 | {max_bnk:.2f}도 | **0도여야 합니다** |",
               f"| 60초 전투 계산에 걸린 시간 | {wall:.1f}초 | 짧을수록 서버에 여유가 있습니다 |",
               "", "## 현재 설정값", "",
               f"- 기체 크기는 기본의 **{ac['mscale']}배**, 맞는 판정 범위는 **{game.CFG['planeR']}m** 입니다.",
               f"- 초당 회전 속도는 위아래 {math.degrees(ac['pitchRate']):.0f}도, "
               f"좌우 {math.degrees(ac['yawRate']):.0f}도, 비틀기 {math.degrees(ac['rollRate']):.0f}도 입니다.",
               f"- {game.WEAPONS[0]['label']}의 위력은 {game.WEAPONS[0]['dmg']}, "
               f"{game.WEAPONS[1]['label']}의 위력은 {game.WEAPONS[1]['dmg']} 입니다.",
               "", "## 이상한 점", ""]
          if bad:
              L += [f"- ⚠️ {b}" for b in bad]
          else:
              L += ["이상 없습니다. 모든 값이 정상 범위 안에 있습니다."]

          body = "\n".join(L)
          print(body)
          with open("/tmp/report.md", "w", encoding="utf-8") as f: f.write(body)
          with open("/tmp/anomalies", "w") as f: f.write(str(len(bad)))
          PY
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 이상이 있을 때만 이슈를 올린다
        run: |
          N=$(cat /tmp/anomalies)
          [ "$N" -eq 0 ] && { echo "이상 없음 → 요약 화면에만 남기고 이슈는 만들지 않습니다"; exit 0; }
          # 같은 경고가 매번 쌓이지 않게 합니다. 문제가 계속되고 있다면
          # 이미 열려 있는 이슈가 그 사실을 말해주고 있습니다.
          if [ "$(gh issue list --label measure --state open --json number --jq length)" != "0" ]; then
            echo "같은 종류의 이슈가 이미 열려 있어 새로 만들지 않습니다"; exit 0
          fi
          gh label create measure --color 1D76DB --description "측정원 보고" 2>/dev/null || true
          gh issue create \
            --title "게임 상태 이상 ${N}건 — $(TZ=Asia/Seoul date '+%m월 %d일 %H:%M')" \
            --label measure --body-file /tmp/report.md
        env:
          GH_TOKEN: ${{ github.token }}
