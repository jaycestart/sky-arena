# 개발자 — 정비공이 손잡이로 못 고친 문제를 실제로 코드를 고쳐 해결합니다.
#
# ── 정비공과 무엇이 다른가 ──────────────────────────────────────
# 정비공은 미리 정해둔 숫자만 조절합니다. 개발자는 코드를 새로 씁니다.
# 그래서 언어 모델이 필요하고, 모델을 부르려면 열쇠(API 키)가 있어야 합니다.
#
# ── 왜 이 방식인가 ──────────────────────────────────────────────
# GitHub 가 무료로 주던 모델 서비스는 폐지되는 중입니다(2026-08 확인, HTTP 410).
# 대신 Google 과 Groq 이 신용카드 없이 무료로 열쇠를 내줍니다. 둘 중 아무거나
# 저장소 비밀값으로 넣어두면 개발자가 알아서 골라 씁니다.
#
#   GEMINI_API_KEY  ← https://aistudio.google.com/apikey  (무료, 카드 불필요)
#   GROQ_API_KEY    ← https://console.groq.com/keys       (무료, 카드 불필요)
#
# 열쇠가 없으면 아무 일도 하지 않고 조용히 물러납니다. 실패로 찍히지 않습니다.
#
# ── 안전장치 ────────────────────────────────────────────────────
# 사람 결재 없이 반영하므로 다음을 모두 통과해야만 올립니다.
#   1) 고칠 수 있는 파일만 건드렸는가 (server/*.py, public/js/**)
#   2) 고친 양이 지나치게 크지 않은가 (200줄 이하)
#   3) 문법 검사를 통과하는가
#   4) 봇 60초 전투에서 격추와 사망이 균형을 이루고, 저절로 기울지 않고,
#      수직 기동이 살아 있는가
#   5) 화면 정보량이 기준 안인가
# 하나라도 어긋나면 전부 되돌리고, 무엇이 왜 실패했는지 이슈에 적습니다.
name: 개발자

on:
  workflow_run:
    workflows: ["버그 사냥꾼"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: developer
  cancel-in-progress: false

jobs:
  develop:
    name: 코드 수리
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 열쇠가 있는지, 맡길 일이 있는지 본다
        id: check
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] && [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "열쇠가 없습니다. 개발자는 대기합니다."
            echo "go=no" >> $GITHUB_OUTPUT; exit 0
          fi
          # 정비공이 못 고친 것, 버그 사냥꾼이 찾은 것을 오래된 순서로 하나만
          N=$(gh issue list --state open --limit 20 --json number,title,labels \
              --jq '[.[] | select([.labels[].name] | any(. == "정비불가" or . == "bughunt"))]
                    | sort_by(.number) | .[0].number // empty')
          if [ -z "$N" ]; then
            echo "맡길 일이 없습니다."
            echo "go=no" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "맡을 일: #$N"
          echo "go=yes"  >> $GITHUB_OUTPUT
          echo "issue=$N" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 문제를 읽고 고쳐본다
        id: work
        if: steps.check.outputs.go == 'yes'
        run: |
          gh issue view ${{ steps.check.outputs.issue }} --json title,body \
            --jq '"제목: \(.title)\n\n\(.body)"' > /tmp/issue.txt
          python .github/scripts/developer.py
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ISSUE: ${{ steps.check.outputs.issue }}

      - name: 고친 것이 정말 멀쩡한지 확인한다
        id: verify
        if: steps.work.outputs.patched == 'yes'
        run: |
          cd server
          python -m py_compile game.py flightmath.py app.py
          PYTHONIOENCODING=utf-8 python - <<'PY'
          import math, random, json, sys
          random.seed(7)
          import game
          w=game.World("v"); mb=mp=0.0
          for _ in range(3000):
              w.step(1/50); w.events.clear()
              for p in w.planes.values():
                  if p.alive:
                      mp=max(mp,abs(math.degrees(p.pit))); mb=max(mb,abs(math.degrees(p.bnk)))
          k=sum(p.kills for p in w.planes.values()); d=sum(p.deaths for p in w.planes.values())
          random.seed(5)
          w2=game.World("s")
          for i in range(18): w2.add_player(f"P{i}", ("falcon","eagle","flanker")[i%3])
          for _ in range(300):
              for p in w2.planes.values(): p.want_fire=True; p.want_missile=True
              w2.step(1/50); w2.events.clear()
          size=len(json.dumps(w2.snapshot(next(iter(w2.planes.values())),{}),separators=(',',':')).encode())
          bad=[]
          if d>k+3:  bad.append(f"사망 {d} 이 격추 {k} 보다 많다")
          if k==0:   bad.append("격추 0")
          if mb>1.0: bad.append(f"저절로 기울어짐 {mb:.1f}도")
          if mp<30:  bad.append("수직 기동 사라짐")
          if size>10240: bad.append(f"화면 정보량 {size/1024:.1f}KB")
          print(f"격추 {k} 사망 {d} 기수각 {mp:.0f} 기울기 {mb:.2f} 정보량 {size/1024:.1f}KB")
          if bad:
              open("/tmp/why.txt","w",encoding="utf-8").write("검증 실패: " + ", ".join(bad))
              print("검증 실패:", bad); sys.exit(1)
          print("검증 통과")
          PY

      - name: 통과했으면 바로 반영한다
        if: steps.work.outputs.patched == 'yes' && steps.verify.outcome == 'success'
        run: |
          git config user.name  "개발자"
          git config user.email "actions@github.com"
          git add -A
          {
            echo "개발자 자동 수리 — 이슈 #${{ steps.check.outputs.issue }}"
            echo
            cat /tmp/summary.txt
            echo
            echo "검증: 문법 검사, 봇 60초 전투(격추/사망 균형·자체 기울기 0도·수직 기동),"
            echo "꽉 찬 방 화면 정보량 기준 통과."
            echo
            echo "Closes #${{ steps.check.outputs.issue }}"
          } > /tmp/msg.txt
          git commit -F /tmp/msg.txt || { echo "실패지점: commit"; exit 1; }
          git push origin HEAD:main  || { echo "실패지점: push"; exit 1; }
          gh issue comment ${{ steps.check.outputs.issue }} --body "개발자가 코드를 고쳐 해결했습니다.

          $(cat /tmp/summary.txt)

          검증을 통과해 곧바로 반영했습니다." || true
          gh issue close ${{ steps.check.outputs.issue }} || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 실패했으면 되돌리고 솔직히 적는다
        if: always() && steps.work.outputs.patched == 'yes' && steps.verify.outcome == 'failure'
        run: |
          git checkout -- . || true
          gh issue comment ${{ steps.check.outputs.issue }} --body "개발자가 고쳐봤지만 검증을 통과하지 못해 **전부 되돌렸습니다.**
          게임에는 아무 변화도 반영되지 않았습니다.

          $(cat /tmp/why.txt 2>/dev/null || echo '검증 단계에서 실패했습니다.')

          시도한 내용:

          $(cat /tmp/summary.txt 2>/dev/null || echo '(요약 없음)')

          사람이 봐야 합니다."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 고치지 못했으면 그렇게 적는다
        if: steps.work.outputs.patched == 'no'
        run: |
          gh issue comment ${{ steps.check.outputs.issue }} --body "개발자가 이 문제를 살펴봤지만 고치지 못했습니다.

          $(cat /tmp/summary.txt 2>/dev/null || echo '이유를 적지 못했습니다.')

          추측으로 고치고 고쳤다고 하지 않기 위해 손대지 않았습니다." || true
        env:
          GH_TOKEN: ${{ github.token }}
