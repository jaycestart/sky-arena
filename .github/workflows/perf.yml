# 성능 감시원 — 서버가 느려지는 순간을 잡아내는 직원입니다.
# 사장님이 가장 먼저 요구한 것이 "렉이 없을 것" 이라 이 일을 맡겼습니다.
#
# 출근은 keep-alive 가 끝날 때마다 함께 합니다. cron 만 믿을 수 없기
# 때문입니다 — 배치 첫날 21:20 정기 근무가 한 번도 돌지 않았습니다.
name: 성능 감시원

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["keep-alive"]
    types: [completed]
  schedule:
    - cron: "20 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bench:
    name: 서버 부담 측정
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 계산 시간과 정보량을 잰다
        run: |
          cd server
          python - <<'PY'
          import time, random, json
          random.seed(5)
          import game

          # 평소 상황 (봇 6대)
          w=game.World("perf")
          for _ in range(500): w.step(1/50); w.events.clear()   # 예열
          N=2000; t0=time.perf_counter()
          for _ in range(N): w.step(1/50); w.events.clear()
          idle_ms=(time.perf_counter()-t0)/N*1000

          # 꽉 찬 상황 (24대가 쉬지 않고 발사)
          w2=game.World("perf2")
          for k in range(18): w2.add_player(f"P{k}", ("falcon","eagle","flanker")[k%3])
          for _ in range(300):
              for p in w2.planes.values(): p.want_fire=True; p.want_missile=True
              w2.step(1/50); w2.events.clear()
          t0=time.perf_counter()
          for _ in range(1000):
              for p in w2.planes.values(): p.want_fire=True; p.want_missile=True
              w2.step(1/50); w2.events.clear()
          load_ms=(time.perf_counter()-t0)/1000*1000

          viewer=next(iter(w2.planes.values()))
          size=len(json.dumps(w2.snapshot(viewer,{}),separators=(',',':')).encode())

          bad=[]
          if idle_ms>15:
              bad.append(f"평소에도 한 번 계산하는 데 {idle_ms:.1f}밀리초가 걸립니다. "
                         f"20밀리초 안에 끝내야 하는데 여유가 거의 없습니다.")
          if load_ms>18:
              bad.append(f"방이 꽉 찼을 때 한 번 계산에 {load_ms:.1f}밀리초가 걸립니다. "
                         f"20밀리초를 넘기면 게임이 눈에 띄게 느려집니다.")
          if size>10240:
              bad.append(f"화면에 보여줄 정보를 한 번 보낼 때 {size/1024:.1f}KB나 됩니다. "
                         f"1초에 25번 보내니까 접속자 한 명당 초당 {size*25/1024/1024:.1f}MB를 쓰는 셈입니다. "
                         f"무료 서버로는 사람이 몇 명만 모여도 버티기 어렵습니다.")

          L=["## 서버 성능", "",
             "서버가 게임을 한 번 계산하는 데 걸리는 시간과, 화면에 보낼 정보의 크기를 쟀습니다.", "",
             "| 항목 | 측정값 | 경고 기준 |", "|---|---|---|",
             f"| 평소 계산 시간 (봇 6대) | {idle_ms:.2f}밀리초 | 15밀리초 |",
             f"| 꽉 찼을 때 계산 시간 (24대 연사) | {load_ms:.2f}밀리초 | 18밀리초 |",
             f"| 한 번에 보내는 정보량 | {size/1024:.1f}KB | 10KB |",
             "",
             "서버는 1초에 50번 계산하므로 한 번에 20밀리초 안에 끝내야 합니다. "
             "검사용 컴퓨터가 실제 서버와 성능이 달라 경고 기준을 조금 낮게 잡아두었습니다.",
             "", "## 이상한 점", ""]
          L += [f"- ⚠️ {b}" for b in bad] if bad else ["이상 없습니다. 모두 여유 범위 안에 있습니다."]
          body="\n".join(L); print(body)
          open("/tmp/report.md","w",encoding="utf-8").write(body)
          open("/tmp/anomalies","w").write(str(len(bad)))
          PY
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 기준을 넘었을 때만 이슈를 올린다
        run: |
          N=$(cat /tmp/anomalies)
          [ "$N" -eq 0 ] && { echo "여유 범위 안 → 이슈를 만들지 않습니다"; exit 0; }
          if [ "$(gh issue list --label perf --state open --json number --jq length)" != "0" ]; then
            echo "같은 종류의 이슈가 이미 열려 있어 새로 만들지 않습니다"; exit 0
          fi
          gh label create perf --color FBCA04 --description "성능 감시원 경고" 2>/dev/null || true
          gh issue create --title "서버 성능 경고 ${N}건 — $(TZ=Asia/Seoul date '+%m월 %d일 %H:%M')" \
            --label perf --body-file /tmp/report.md
        env:
          GH_TOKEN: ${{ github.token }}
