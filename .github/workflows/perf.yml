# 성능 감시원 — 서버가 느려지는 순간을 잡는다. 사용자 1순위 요구가
# '렉이 없을 것'이다. 틱 비용과 스냅샷 크기를 재고, 예산을 넘으면 이슈를 낸다.
#
# 예산 근거: 서버는 50Hz(틱당 20ms)로 돈다. CI 러너는 실제 서버보다 느리므로
# 경고선을 15ms 로 잡았다 — 여기서 15ms 면 Render 무료 인스턴스에서 위험하다.
# 스냅샷은 25Hz 로 나가므로 10KB 를 넘으면 대역폭이 초당 250KB/명이 된다.
name: 성능 감시원

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 12 * * *"     # 21:20 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bench:
    name: 틱 비용 측정
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 서버 틱과 스냅샷을 잰다
        run: |
          cd server
          python - <<'PY'
          import time, random, json
          random.seed(5)
          import game

          # 평상시 (봇 6기)
          w=game.World("perf")
          for _ in range(500): w.step(1/50); w.events.clear()   # 워밍업
          N=2000; t0=time.perf_counter()
          for _ in range(N): w.step(1/50); w.events.clear()
          idle_ms=(time.perf_counter()-t0)/N*1000

          # 부하 상황 (18기 전원 연사)
          w2=game.World("perf2")
          for k in range(18): w2.add_player(f"P{k}", ("falcon","eagle","flanker")[k%3])
          for _ in range(300):
              for p in w2.planes.values(): p.want_fire=True; p.want_missile=True
              w2.step(1/50); w2.events.clear()
          t0=time.perf_counter()
          for _ in range(1000):
              for p in w2.planes.values(): p.want_fire=True; p.want_missile=True
              w2.step(1/50); w2.events.clear()
          load_ms=(time.perf_counter()-t0)/1000*1000

          viewer=next(iter(w2.planes.values()))
          snap=w2.snapshot(viewer,{})
          size=len(json.dumps(snap,separators=(',',':')).encode())

          bad=[]
          if idle_ms>15: bad.append(f"평상시 틱 {idle_ms:.1f}ms — 예산 20ms 에 위험 (경고선 15)")
          if load_ms>18: bad.append(f"부하시 틱 {load_ms:.1f}ms — 만원 방에서 서버가 밀린다")
          if size>10240: bad.append(f"스냅샷 {size}B — 25Hz 면 초당 {size*25//1024}KB/명")

          L=["## 성능 측정","",
             "| 항목 | 값 | 경고선 |","|---|---|---|",
             f"| 평상시 틱 (봇 6기) | {idle_ms:.2f}ms | 15ms |",
             f"| 부하시 틱 (24기 연사) | {load_ms:.2f}ms | 18ms |",
             f"| 스냅샷 크기 | {size}B | 10KB |",
             "","서버 틱 예산은 20ms(50Hz)다. CI 러너가 실서버보다 느려 경고선을 낮게 잡았다.",
             "","## 이상 징후",""]
          L += [f"- ⚠️ {b}" for b in bad] if bad else ["없음. 예산 안에 있다."]
          body="\n".join(L); print(body)
          open("/tmp/report.md","w",encoding="utf-8").write(body)
          open("/tmp/anomalies","w").write(str(len(bad)))
          PY
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 예산을 넘었을 때만 이슈
        run: |
          N=$(cat /tmp/anomalies)
          [ "$N" -eq 0 ] && { echo "예산 안 → 이슈 안 만든다"; exit 0; }
          # 같은 경고가 커밋마다 쌓이는 것을 막는다. 문제가 계속이면
          # 이미 열린 이슈가 그 사실을 말하고 있다 — 닫힌 뒤에만 새로 연다.
          if [ "$(gh issue list --label perf --state open --json number --jq length)" != "0" ]; then
            echo "같은 라벨의 이슈가 이미 열려 있다 → 중복 생성 안 함"; exit 0
          fi
          gh label create perf --color FBCA04 --description "성능 감시원 경고" 2>/dev/null || true
          gh issue create --title "성능 경고 ${N}건 — $(TZ=Asia/Seoul date '+%m-%d %H:%M')" \
            --label perf --body-file /tmp/report.md
        env:
          GH_TOKEN: ${{ github.token }}
