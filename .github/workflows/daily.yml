# 일일보고 — AI 회사를 GitHub Actions 로 옮긴 것.
#
# 왜 옮겼나: 클라우드 예약 에이전트(routines)가 실행 기록만 남기고 아무
# 산출물도 내지 않았다. PR 0, 이슈 0, 진단 보고 0. 세션 페이지도 비어 있어
# **안에서 무슨 일이 나는지 볼 방법이 없었다.** 볼 수 없으면 고칠 수 없다.
#
# 여기는 다르다. 로그가 전부 남고, 저장소 쓰기 권한(GITHUB_TOKEN)이 기본으로
# 주어지고, 이미 검사원 3명이 같은 자리에서 잘 돌고 있다. 무엇보다 **내가
# 결과를 직접 확인할 수 있다.**
#
# 대신 여기 직원들은 LLM 이 아니라 **결정론적 측정원**이다. 스스로 코드를
# 고치지는 못하지만, 매일 게임을 돌려 숫자를 재고 이상하면 보고한다.
# 사람이 판단할 재료를 만드는 것 — 그게 지금 가장 부족한 것이었다.
name: 일일보고

on:
  schedule:
    - cron: "0 12 * * *"      # 매일 21:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: 비서 — 하루 결산
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 게임을 돌려 상태를 잰다
        id: measure
        run: |
          cd server
          python - <<'PY' > /tmp/measure.md
          import math, random, time, io, sys
          random.seed(7)
          import game

          w = game.World("daily")
          dt = 1 / 50
          launches = booms = 0
          max_pit = max_bnk = 0.0
          t0 = time.perf_counter()
          for _ in range(3000):                     # 60초
              w.step(dt)
              for e in w.events:
                  if e.get("e") == "launch": launches += 1
                  if e.get("e") == "boom":   booms += 1
              w.events.clear()
              for p in w.planes.values():
                  if p.alive:
                      max_pit = max(max_pit, abs(math.degrees(p.pit)))
                      max_bnk = max(max_bnk, abs(math.degrees(p.bnk)))
          wall = time.perf_counter() - t0

          n = len(w.planes)
          kills = sum(p.kills for p in w.planes.values())
          deaths = sum(p.deaths for p in w.planes.values())
          alive = sum(1 for p in w.planes.values() if p.alive)
          cap = n * (1 / game.WEAPONS[0]["cd"] + 1 / game.WEAPONS[1]["cd"])
          rate = launches / 60
          ac = game.AIRCRAFT["falcon"]

          print("## 오늘의 게임 상태")
          print()
          print("봇 6기로 60초를 돌려 잰 값이다.")
          print()
          print("| 항목 | 값 | 정상 범위 |")
          print("|---|---|---|")
          print(f"| 격추 | {kills}회 | 사망과 비슷해야 함 |")
          print(f"| 사망 | {deaths}회 | 격추보다 훨씬 많으면 추락·이탈 |")
          print(f"| 생존 | {alive}/{n}기 | 0 이면 재출격 고장 |")
          print(f"| 발사 | 초당 {rate:.1f}발 | 이론상 최대 {cap:.1f}발 |")
          print(f"| 폭발 | {booms}회 | 발사보다 많으면 이상 |")
          print(f"| 기수각 최대 | {max_pit:.0f}도 | 30도 미만이면 수직 기동 실종 |")
          print(f"| 비틀기 최대 | {max_bnk:.2f}도 | **0 이어야 함** |")
          print(f"| 60초 시뮬 소요 | {wall:.1f}초 | 서버 여유 |")
          print()
          print("## 현재 설정값")
          print()
          print(f"- 기체 배율 **{ac['mscale']}배** · 피격 반경 **{game.CFG['planeR']}m**")
          print(f"- 회전율 피치 {math.degrees(ac['pitchRate']):.0f}°/s · "
                f"요 {math.degrees(ac['yawRate']):.0f} · 롤 {math.degrees(ac['rollRate']):.0f}")
          print(f"- 무기 {game.WEAPONS[0]['label']}(피해 {game.WEAPONS[0]['dmg']}) / "
                f"{game.WEAPONS[1]['label']}(피해 {game.WEAPONS[1]['dmg']})")
          print()

          bad = []
          if deaths > kills + 3: bad.append(f"사망({deaths})이 격추({kills})보다 많다 — 추락·이탈 의심")
          if kills == 0:         bad.append("60초 동안 격추 0회 — 무기나 조준이 죽었다")
          if rate > cap * 1.5:   bad.append(f"발사가 이론 최대의 {rate/cap:.1f}배 — 쿨다운이 샌다")
          if max_bnk > 1.0:      bad.append(f"봇이 저절로 비틀린다({max_bnk:.1f}도) — 자세 모델 누수")
          if max_pit < 30:       bad.append("수직 기동 실종 — 옛 원반 선회로 회귀")
          if alive == 0:         bad.append("전멸 — 재출격 고장")

          print("## 이상 징후")
          print()
          if bad:
              for b in bad: print(f"- ⚠️ {b}")
          else:
              print("없음. 위 값이 모두 정상 범위다.")
          PY
          cat /tmp/measure.md

      - name: 지난 하루 변화를 모은다
        run: |
          {
            echo
            echo "## 지난 24시간"
            echo
            N=$(git log --since="24 hours ago" --oneline | wc -l)
            if [ "$N" -eq 0 ]; then
              echo "커밋 없음."
            else
              echo "커밋 ${N}건:"
              echo
              git log --since="24 hours ago" --pretty='- %s' | head -20
            fi
            echo
            echo "## 결재 대기"
            echo
            PRS=$(gh pr list --state open --json number,title,headRefName \
                  --jq '.[] | "- #\(.number) \(.title)  `\(.headRefName)`"' 2>/dev/null || echo "")
            if [ -z "$PRS" ]; then echo "열린 PR 없음."; else echo "$PRS"; fi
            echo
            echo "---"
            echo "*이 보고서는 매일 21:00(KST)에 자동 생성됩니다. "
            echo "숫자는 실제로 게임을 60초 돌려 잰 값이고, 추정이 아닙니다.*"
          } >> /tmp/measure.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 보고서를 이슈로 올린다
        run: |
          gh label create daily-report --color 0E8A16 \
            --description "자동 일일보고" 2>/dev/null || true
          gh issue create \
            --title "일일보고 — $(TZ=Asia/Seoul date +%Y-%m-%d)" \
            --label daily-report \
            --body-file /tmp/measure.md
        env:
          GH_TOKEN: ${{ github.token }}
