# 현황판 담당 — 회사 현황을 정적 파일 하나로 써서 저장소에 올립니다.
#
# ── 왜 이렇게 하나 ──────────────────────────────────────────────
# 처음에는 현황판(브라우저)이 GitHub API 를 직접 불렀습니다. 로그인 없이
# 부르면 IP 하나당 시간당 60회가 전부인데, 한 번 열 때 4회를 쓰고 5분마다
# 다시 불러서 금방 바닥났습니다. 화면 전체가 "GitHub 403" 만 떴습니다.
#
# 다음으로 서버가 대신 받아 캐시하게 했는데 이것도 실패했습니다. Render 의
# IP 는 다른 서비스들과 공유돼서 우리가 한 번도 부르기 전에 이미 한도가
# 차 있었습니다.
#
# 그래서 GitHub API 를 아예 부르지 않기로 했습니다. 직원이 근무할 때마다
# 여기서 현황을 파일로 써서 저장소에 올리면, 현황판은 그냥 정적 파일 하나를
# 읽습니다. 한도도 열쇠도 필요 없습니다. 여기서 쓰는 gh 명령은 Actions 가
# 주는 토큰을 쓰므로 시간당 1000회까지 됩니다.
#
# ── 밀어올릴 때 충돌하던 문제 ───────────────────────────────────
# 처음에는 파일을 쓴 뒤 커밋하고 rebase 해서 올렸는데, 매번 실패했습니다.
# 자기가 지난번에 올린 company.json 과 이번에 쓴 company.json 이 같은 줄을
# 건드려 rebase 가 충돌하고, 그러면 abort 하고 뒤처진 상태로 push 해서
# 거절당했습니다. 그 결과 현황판이 다섯 시간 동안 멈춰 있었습니다.
#
# 지금은 순서를 바꿨습니다. 파일을 임시로 만들어 두고 → 최신 main 으로
# 완전히 맞춘 뒤 → 그 위에 덮어씁니다. 이 파일은 매번 통째로 새로 만드는
# 것이라 남의 수정을 덮어쓸 걱정이 없어서, 충돌이라는 개념 자체가 없어집니다.
name: 현황판

on:
  workflow_run:
    workflows: ["비서", "정비공", "측정원", "성능 감시원", "버그 사냥꾼", "실력 균형 검사원", "개발자"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: board
  cancel-in-progress: true

jobs:
  write:
    name: 현황 파일 갱신
    runs-on: ubuntu-latest
    steps:
      # 커밋 하나만 가져오면 최근 작업 목록이 한 줄만 나온다(실제로 그랬다).
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 방금 갱신했으면 건너뛴다
        id: recent
        run: |
          # 직원 일곱이 몇 초 차이로 끝나면 현황판이 그만큼 커밋한다.
          # 마지막 갱신이 10분 안이면 넘어간다.
          LAST=$(git log -1 --format=%ct --grep="현황판 갱신" || echo 0)
          NOW=$(date +%s)
          if [ -n "$LAST" ] && [ "$LAST" != "0" ] && [ $((NOW - LAST)) -lt 600 ]; then
            echo "$(( (NOW - LAST) / 60 ))분 전에 갱신했습니다. 건너뜁니다."
            echo "skip=yes" >> $GITHUB_OUTPUT
          else
            echo "skip=no" >> $GITHUB_OUTPUT
          fi

      - name: 현황을 임시 파일로 쓴다
        if: steps.recent.outputs.skip == 'no'
        run: |
          python - <<'PY' > /tmp/company.json
          import json, subprocess

          def gh(args):
              r = subprocess.run(["gh"] + args, capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode == 0 and r.stdout.strip() else []

          runs = gh(["run", "list", "--limit", "60", "--json",
                     "workflowName,status,conclusion,createdAt,url"])
          staff, seen = [], set()
          for r in runs:
              n = r["workflowName"]
              if n in seen or n in ("keep-alive", "현황판"):
                  continue
              seen.add(n)
              staff.append({"name": n, "status": r["status"],
                            "conclusion": r["conclusion"],
                            "at": r["createdAt"], "url": r["url"]})

          issues = [{"n": i["number"], "title": i["title"], "at": i["createdAt"],
                     "url": i["url"], "labels": [l["name"] for l in i["labels"]]}
                    for i in gh(["issue", "list", "--state", "open", "--limit", "15",
                                 "--json", "number,title,createdAt,url,labels"])]

          prs = [{"n": p["number"], "title": p["title"], "at": p["createdAt"],
                  "url": p["url"]}
                 for p in gh(["pr", "list", "--state", "open", "--limit", "10",
                              "--json", "number,title,createdAt,url"])]

          log = subprocess.run(["git", "log", "-8", "--pretty=%s%x1f%aI%x1f%H"],
                               capture_output=True, text=True).stdout.strip().split("\n")
          commits = []
          for line in log:
              if not line.strip():
                  continue
              msg, at, sha = line.split("\x1f")
              commits.append({"msg": msg, "at": at,
                              "url": f"https://github.com/jaycestart/sky-arena/commit/{sha}"})

          print(json.dumps({"staff": staff, "issues": issues,
                            "prs": prs, "commits": commits},
                           ensure_ascii=False, indent=1))
          PY
          echo "쓴 크기: $(wc -c < /tmp/company.json) 바이트"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 최신 main 위에 덮어쓰고 올린다
        if: steps.recent.outputs.skip == 'no'
        run: |
          git config user.name  "현황판"
          git config user.email "actions@github.com"
          # 세 번까지 다시 시도한다. 다른 직원이 그 사이에 올렸을 수 있다.
          for try in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main       # 우리 커밋을 버리고 최신에 맞춘다
            cp /tmp/company.json public/company.json
            if git diff --quiet public/company.json; then
              echo "현황이 그대로입니다. 올리지 않습니다."
              exit 0
            fi
            git add public/company.json
            git commit -q -m "현황판 갱신 — $(TZ=Asia/Seoul date '+%m월 %d일 %H:%M')"
            if git push -q origin HEAD:main 2>/dev/null; then
              echo "올렸습니다 (${try}번째 시도)"
              exit 0
            fi
            echo "${try}번째 시도 실패 — 다른 직원이 먼저 올린 것 같습니다. 다시 맞춥니다."
            sleep 3
          done
          echo "세 번 다 실패했습니다."
          exit 1
