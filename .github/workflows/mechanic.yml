# 정비공 — 사장님 허락 없이 스스로 고치고 바로 반영하는 직원입니다.
#
# ── 무엇을 고칠 수 있고 무엇을 못 고치나 ────────────────────────
# 이 직원은 사람처럼 코드를 새로 짜지 못합니다. 대신 **미리 정해둔 조절
# 손잡이를 돌려서** 지표를 기준 안으로 되돌립니다. 예를 들어 화면 정보량이
# 너무 크면 game.py 의 maxMissiles 를 낮춥니다. 손잡이로 안 되는 문제는
# 솔직히 "못 고쳤다"고 적고 사람에게 넘깁니다 — 추측으로 고쳐놓고 고쳤다고
# 하는 것이 이 프로젝트에서 가장 많이 시간을 버린 실수였습니다.
#
# ── 왜 바로 main 에 올리나 ──────────────────────────────────────
# 사장님이 "내 개입 없이 스스로 고치라"고 지시했습니다. 그래서 결재를
# 기다리지 않고 바로 반영합니다. 대신 올리기 전에 반드시,
#   1) 고친 뒤 지표가 실제로 기준 안에 들어왔는지 다시 재고
#   2) 문법 검사와 60초 봇 전투를 통과하는지 확인하고
#   3) 하나라도 어긋나면 되돌리고 아무것도 올리지 않습니다.
# 검증을 통과한 것만 올라가므로, 망가진 채로 배포되는 일은 없습니다.
#
# 한 번에 손잡이 하나만 돌립니다. 여러 개를 같이 돌리면 무엇이 효과가
# 있었는지 알 수 없게 됩니다.
name: 정비공

on:
  # 성능 감시원 하나만 계기로 삼습니다. 세 팀을 다 걸었더니 같은 순간에
  # 정비공이 셋 깨어나 둘이 대기 중 취소됐습니다. 정비공이 돌릴 수 있는
  # 손잡이는 지금 성능 지표뿐이라 나머지는 깨울 이유가 없습니다.
  workflow_run:
    workflows: ["성능 감시원"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mechanic          # 두 명이 동시에 고치면 서로 덮어쓴다
  cancel-in-progress: false

jobs:
  repair:
    name: 자동 수리
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 고칠 곳이 있는지 보고 손잡이를 돌린다
        id: fix
        run: |
          cd server
          python - <<'PY'
          import io, json, math, os, random, re

          def snapshot_size():
              """꽉 찬 방에서 한 번에 내려보내는 정보량(바이트)."""
              random.seed(5)
              import importlib, game
              importlib.reload(game)
              w = game.World("m")
              for k in range(18):
                  w.add_player(f"P{k}", ("falcon","eagle","flanker")[k%3])
              for _ in range(300):
                  for p in w.planes.values(): p.want_fire=True; p.want_missile=True
                  w.step(1/50); w.events.clear()
              v = next(iter(w.planes.values()))
              return len(json.dumps(w.snapshot(v,{}),separators=(',',':')).encode())

          def read_knob(name):
              s = io.open("game.py", encoding="utf-8").read()
              m = re.search(rf'"{name}": (\d+),\s*# \[정비공조절\] (\d+)~(\d+)', s)
              return (int(m.group(1)), int(m.group(2)), int(m.group(3))) if m else None

          def write_knob(name, val):
              s = io.open("game.py", encoding="utf-8").read()
              s2 = re.sub(rf'("{name}": )\d+(,\s*# \[정비공조절\])', rf'\g<1>{val}\g<2>', s)
              io.open("game.py","w",encoding="utf-8",newline="\n").write(s2)

          BUDGET = 10240
          log, fixed, gave_up, healthy = [], None, None, False

          size = snapshot_size()
          if size <= BUDGET:
              healthy = True
              log.append(f"화면 정보량 {size/1024:.1f}KB — 기준 안입니다. 손댈 것이 없습니다.")
          else:
              knob = read_knob("maxMissiles")
              if not knob:
                  gave_up = "화면 정보량이 기준을 넘었는데 조절 손잡이를 찾지 못했습니다."
              else:
                  cur, lo, hi = knob
                  log.append(f"화면 정보량이 {size/1024:.1f}KB 로 기준 10KB 를 넘었습니다. "
                             f"미사일 상한을 {cur}발부터 낮춰봅니다.")
                  val = cur
                  while val > lo:
                      val = max(lo, int(val * 0.7))
                      write_knob("maxMissiles", val)
                      size = snapshot_size()
                      log.append(f"  상한 {val}발 → {size/1024:.1f}KB")
                      if size <= BUDGET:
                          fixed = (f"미사일 상한을 {cur}발에서 {val}발로 낮췄습니다. "
                                   f"화면 정보량이 기준 안({size/1024:.1f}KB)으로 들어왔습니다.")
                          break
                  if not fixed:
                      write_knob("maxMissiles", cur)      # 되돌린다
                      gave_up = (f"미사일 상한을 최소값 {lo}발까지 낮춰도 화면 정보량이 "
                                 f"{size/1024:.1f}KB 로 기준을 넘습니다. 손잡이로는 해결되지 "
                                 f"않습니다. 사람이 봐야 합니다.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"fixed={'yes' if fixed else 'no'}\n")
              f.write(f"gaveup={'yes' if gave_up else 'no'}\n")
              f.write(f"healthy={'yes' if healthy else 'no'}\n")
              f.write(f"size={size/1024:.1f}\n")
              f.write(f"what={fixed or gave_up or ''}\n")
          io.open("/tmp/worklog.md","w",encoding="utf-8").write("\n".join(log))
          if gave_up: io.open("/tmp/gaveup.md","w",encoding="utf-8").write(gave_up)
          print("\n".join(log))
          PY

      - name: 고친 것이 정말 멀쩡한지 확인한다
        id: verify
        if: steps.fix.outputs.fixed == 'yes'
        run: |
          cd server
          python -m py_compile game.py flightmath.py app.py
          PYTHONIOENCODING=utf-8 python - <<'PY'
          import math, random, sys
          random.seed(7)
          import game
          w=game.World("v"); k=d=0; mb=mp=0.0
          for _ in range(3000):
              w.step(1/50); w.events.clear()
              for p in w.planes.values():
                  if p.alive:
                      mp=max(mp,abs(math.degrees(p.pit))); mb=max(mb,abs(math.degrees(p.bnk)))
          k=sum(p.kills for p in w.planes.values()); d=sum(p.deaths for p in w.planes.values())
          bad=[]
          if d>k+3: bad.append(f"deaths {d} > kills {k}")
          if k==0:  bad.append("no kills")
          if mb>1.0: bad.append(f"self-roll {mb:.1f}")
          if mp<30: bad.append("no vertical")
          print("kills",k,"deaths",d,"maxpitch",round(mp),"maxbank",round(mb,2))
          if bad: print("VERIFY FAILED:", bad); sys.exit(1)
          print("verify ok")
          PY

      # 반영과 뒷정리를 나눕니다. 처음에는 한 단계에 몰아넣었더니 수리와
      # 반영이 다 끝난 뒤 뒷정리에서 넘어져 실행 전체가 실패로 찍혔습니다.
      # 고쳐서 올린 것이 사실인데 실패로 보이면 사람이 잘못 판단합니다.
      # 어디서 넘어졌는지 알 수 있게 단계마다 표시를 남깁니다.
      - name: 통과했으면 바로 반영한다
        if: steps.fix.outputs.fixed == 'yes' && steps.verify.outcome == 'success'
        run: |
          echo "::group::수리 내용 반영"
          git config user.name  "정비공"
          git config user.email "actions@github.com"
          git add server/game.py                    || { echo "실패지점: git add"; exit 1; }
          {
            echo "정비공 자동 수리 — ${{ steps.fix.outputs.what }}"
            echo
            echo "성능 감시원이 올린 경고를 보고 정비공이 스스로 고쳤습니다."
            echo "사람의 결재를 거치지 않았으므로 올리기 전에 아래를 모두 확인했습니다."
            echo
            cat /tmp/worklog.md
            echo
            echo "검증: 문법 검사 통과. 봇 60초 전투에서 격추와 사망이 균형을 이루고"
            echo "저절로 기울어짐 0도, 수직 기동 유지."
          } > /tmp/msg.txt
          git commit -F /tmp/msg.txt               || { echo "실패지점: git commit"; exit 1; }
          git push origin HEAD:main                || { echo "실패지점: git push"; exit 1; }
          echo "반영 완료"
          echo "::endgroup::"

      - name: 고쳐진 경고를 닫는다
        # 뒷정리라 실패해도 수리 자체를 실패로 만들지 않습니다.
        continue-on-error: true
        if: steps.fix.outputs.fixed == 'yes' && steps.verify.outcome == 'success'
        run: |
          {
            echo "정비공이 자동으로 고쳤습니다."
            echo
            echo "${{ steps.fix.outputs.what }}"
            echo
            cat /tmp/worklog.md
            echo
            echo "검증을 통과해 곧바로 반영했습니다. 이 문제는 닫습니다."
          } > /tmp/comment.md
          for n in $(gh issue list --label perf --state open --json number --jq '.[].number'); do
            echo "닫는 중: #$n"
            gh issue comment "$n" --body-file /tmp/comment.md || echo "  댓글 실패 #$n"
            gh issue close "$n"                               || echo "  닫기 실패 #$n"
          done
          echo "뒷정리 완료"
        env:
          GH_TOKEN: ${{ github.token }}

      # 문제가 사라졌는데 경고만 남아 있는 경우를 치운다.
      #
      # 실제로 이 구멍 때문에 사장님이 "아직도 작동 안 해" 라고 했다. 화면
      # 정보량 경고가 8시간째 열려 있었는데, 그 사이 정비공은 네 번 정상
      # 실행됐다. 문제는 이미 해결됐고 정비공은 "고칠 게 없다"며 물러났을 뿐인데
      # 아무도 그 경고를 닫아주지 않았다. 감시원도 같은 경고가 열려 있으면
      # 새로 만들지 않으니, 한 번 열린 경고는 영원히 남는다.
      #
      # 고친 사람이 없어도 지표가 정상이면 닫는다. 경고는 지금 상태를
      # 말해야지, 과거에 문제가 있었다는 기록으로 남으면 안 된다.
      - name: 문제가 사라졌으면 남은 경고를 닫는다
        if: steps.fix.outputs.healthy == 'yes'
        run: |
          OPEN=$(gh issue list --label perf --state open --json number --jq '.[].number')
          [ -z "$OPEN" ] && { echo "열린 성능 경고가 없습니다."; exit 0; }
          for n in $OPEN; do
            echo "닫는 중: #$n"
            gh issue comment "$n" --body "정비공이 확인했습니다. **이 문제는 해결되었습니다.**

          현재 화면 정보량은 ${{ steps.fix.outputs.size }}KB 로 기준 10KB 안에 있습니다.

          정비공이 직접 고친 것은 아니고, 그 사이 다른 작업으로 해결된 것으로 보입니다.
          지표가 정상이므로 이 경고를 닫습니다. 다시 기준을 넘으면 감시원이 새로 알립니다." || true
            gh issue close "$n" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 못 고쳤으면 솔직히 적는다
        if: steps.fix.outputs.gaveup == 'yes'
        run: |
          if [ "$(gh issue list --label 정비불가 --state open --json number --jq length)" != "0" ]; then
            echo "이미 같은 내용을 올려두었습니다"; exit 0
          fi
          gh label create 정비불가 --color B60205 --description "정비공이 손잡이로 못 고친 문제" 2>/dev/null || true
          {
            echo "## 정비공이 못 고쳤습니다"
            echo
            cat /tmp/gaveup.md
            echo
            echo "### 시도한 것"
            echo
            cat /tmp/worklog.md
            echo
            echo "---"
            echo
            echo "정비공은 미리 정해둔 조절 손잡이만 돌릴 수 있습니다."
            echo "이 문제는 코드를 새로 짜야 해서 사람이 봐야 합니다."
          } > /tmp/body.md
          gh issue create --title "정비공이 못 고친 문제 — $(TZ=Asia/Seoul date '+%m월 %d일')" \
            --label 정비불가 --body-file /tmp/body.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 검증에 실패하면 아무것도 올리지 않는다
        if: steps.fix.outputs.fixed == 'yes' && steps.verify.outcome == 'failure'
        run: |
          gh issue create --title "정비공 수리가 검증을 통과하지 못했습니다 — $(TZ=Asia/Seoul date '+%m월 %d일')" \
            --label 정비불가 --body "정비공이 고쳐봤지만 고친 결과가 검증을 통과하지 못해 되돌렸습니다.
          게임에는 아무 변화도 반영되지 않았습니다. 사람이 봐야 합니다.

          $(cat /tmp/worklog.md)"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
