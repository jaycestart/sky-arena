# 비서 — 매일 저녁, 모든 팀의 결과를 모아 사장님께 한 장으로 보고한다.
#
# 다른 팀들이 21:00~21:20(KST)에 돌고 비서는 21:40 에 돈다 — 그날 결과가
# 다 나온 뒤에 정리하기 위해서다.
#
# push 트리거는 이 파일 자신이 바뀔 때만 걸린다. 배치 직후 실제로 이슈가
# 생기는지 한 번 검증하기 위한 것이고, 평소 커밋에는 반응하지 않는다.
name: 비서

on:
  schedule:
    - cron: "40 12 * * *"     # 21:40 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/secretary.yml']

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  digest:
    name: 하루 결산
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 하루를 모은다
        run: |
          {
            echo "## 오늘 회사가 한 일"
            echo
            echo "### 각 팀 최근 근무 결과"
            echo
            echo "| 팀 | 결과 | 언제 |"
            echo "|---|---|---|"
            gh run list --limit 30 --json name,conclusion,createdAt,workflowName \
              --jq 'group_by(.workflowName) | map(.[0])
                    | map(select(.workflowName != "keep-alive"))
                    | .[] | "| \(.workflowName) | \(if .conclusion=="success" then "✅ 정상" elif .conclusion=="failure" then "❌ 실패" else .conclusion end) | \(.createdAt[5:16] | sub("T";" ")) UTC |"'
            echo
            echo "### 지난 24시간 코드 변화"
            echo
            N=$(git log --since="24 hours ago" --oneline | wc -l)
            if [ "$N" -eq 0 ]; then
              echo "커밋 없음 — 오늘은 코드 변화가 없었습니다."
            else
              echo "커밋 ${N}건:"
              echo
              git log --since="24 hours ago" --pretty='- %s' | head -15
            fi
            echo
            echo "### 결재 대기 (열린 PR)"
            echo
            PRS=$(gh pr list --state open --json number,title \
                  --jq '.[] | "- #\(.number) \(.title)"' 2>/dev/null)
            [ -z "$PRS" ] && echo "없음." || echo "$PRS"
            echo
            echo "### 팀들이 올린 경고 (지난 24시간)"
            echo
            # gh 의 --jq 는 jq 의 --arg 를 받지 않는다(첫 시운전이 여기서
            # 죽었다). 날짜를 셸에서 만들어 문자열로 끼워 넣는다.
            D=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ)
            IS=$(gh issue list --state open --limit 20 \
                 --json number,title,labels,createdAt \
                 --jq ".[] | select(.createdAt > \"$D\")
                      | select([.labels[].name] | any(. == \"bughunt\" or . == \"perf\" or . == \"balance\" or . == \"measure\"))
                      | \"- #\(.number) \(.title)\"" 2>/dev/null || true)
            [ -z "$IS" ] && echo "없음 — 모든 팀이 이상 없음으로 보고했습니다." || echo "$IS"
            echo
            echo "---"
            echo "*비서가 매일 21:40(KST)에 자동 생성. 각 팀 상세는 Actions 탭 → 해당 실행의 Summary.*"
          } > /tmp/digest.md
          cat /tmp/digest.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 보고서를 이슈로 올린다
        run: |
          PREFIX=""
          [ "${{ github.event_name }}" = "push" ] && PREFIX="(시운전) "
          gh label create daily-report --color 0E8A16 --description "비서의 일일보고" 2>/dev/null || true
          gh issue create \
            --title "${PREFIX}일일보고 — $(TZ=Asia/Seoul date +%Y-%m-%d)" \
            --label daily-report \
            --body-file /tmp/digest.md
        env:
          GH_TOKEN: ${{ github.token }}
