# 비서 — 하루에 한 번 사장님께 보고서를 올립니다.
#
# ── 왜 이렇게 만들었나 ──────────────────────────────────────────
# 처음에는 매일 21:40 에 도는 cron 하나만 걸어두었는데, 배치한 날 정기
# 근무가 한 번도 돌지 않았습니다. GitHub 무료 계정의 cron 은 몇 시간씩
# 밀리거나 통째로 걸러집니다. 같은 저장소의 keep-alive 도 12:05, 09:41,
# 05:11 처럼 시각이 제멋대로인 것이 그 증거입니다.
#
# 그래서 시각을 정확히 맞추는 대신 **하루에 반드시 한 번**을 지키기로
# 했습니다. keep-alive 가 끝날 때마다 깨어나서, 오늘 날짜의 보고서가
# 이미 있으면 그냥 물러나고 없으면 새로 씁니다. keep-alive 는 하루에
# 예닐곱 번 도니까 보고서가 빠지는 날은 없습니다. 대신 올라오는 시각은
# 날마다 조금씩 다를 수 있습니다.
name: 비서

on:
  workflow_run:
    workflows: ["keep-alive"]
    types: [completed]
  schedule:
    - cron: "40 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/secretary.yml']

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  digest:
    name: 하루 결산
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 오늘 보고서를 이미 올렸는지 확인한다
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          if gh issue list --label daily-report --state all --limit 30 \
               --json title --jq '.[].title' | grep -q "$TODAY"; then
            echo "이미 $TODAY 보고서가 있습니다. 물러납니다."
            echo "skip=yes" >> $GITHUB_OUTPUT
          else
            echo "$TODAY 보고서가 아직 없습니다. 작성합니다."
            echo "skip=no" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'no'
        with: { python-version: '3.12' }

      - name: 게임 상태를 직접 재서 보고서에 넣는다
        if: steps.guard.outputs.skip == 'no'
        run: |
          cd server
          python - <<'PY'
          import math, random
          random.seed(7)
          import game
          w=game.World("daily"); launches=0; max_pit=max_bnk=0.0
          for _ in range(3000):
              w.step(1/50)
              for e in w.events:
                  if e.get("e")=="launch": launches+=1
              w.events.clear()
              for p in w.planes.values():
                  if p.alive:
                      max_pit=max(max_pit,abs(math.degrees(p.pit)))
                      max_bnk=max(max_bnk,abs(math.degrees(p.bnk)))
          k=sum(p.kills for p in w.planes.values())
          d=sum(p.deaths for p in w.planes.values())
          a=sum(1 for p in w.planes.values() if p.alive)
          L=["| 항목 | 오늘 측정값 |","|---|---|",
             f"| 격추 / 사망 | {k}번 / {d}번 |",
             f"| 살아남은 기체 | {len(w.planes)}대 중 {a}대 |",
             f"| 발사 속도 | 초당 {launches/60:.1f}발 |",
             f"| 기수를 들어올린 최대 각도 | {max_pit:.0f}도 |",
             f"| 저절로 기울어진 최대 각도 | {max_bnk:.2f}도 |"]
          open("/tmp/game.md","w",encoding="utf-8").write("\n".join(L))
          PY

      - name: 보고서를 쓴다
        if: steps.guard.outputs.skip == 'no'
        run: |
          SINCE=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "## 오늘 회사가 한 일"
            echo
            echo "### 오늘 고친 것"
            echo
            FIXED=$(git log --since="24 hours ago" --pretty='%s' \
                    | grep -E '^(정비공 자동 수리|개발자 자동 수리|.*수리|.*고친|.*고쳤|.*막는다|.*해결)' || true)
            NFIX=$(if [ -z "$FIXED" ]; then echo 0; else echo "$FIXED" | wc -l; fi)
            # gh 의 --jq 는 jq 고유 옵션인 --arg 를 받지 않는다. 전에 비서가
            # 이것 때문에 첫 시운전에서 죽었다. 날짜를 문자열로 끼워 넣는다.
            CLOSED=$(gh issue list --state closed --limit 40 \
                     --json number,title,closedAt \
                     --jq "[.[] | select(.closedAt > \"$SINCE\")] | length" 2>/dev/null || echo 0)
            if [ "$NFIX" -eq 0 ]; then
              echo "오늘은 고친 것이 없습니다."
            else
              echo "**${NFIX}건**을 고쳤고, 그 사이 문제 **${CLOSED}건**이 닫혔습니다."
              echo
              echo "$FIXED" | sed 's/^/- /'
            fi
            echo
            echo "### 오늘 새로 들어간 것"
            echo
            NEW=$(git log --since="24 hours ago" --pretty='%s' \
                  | grep -vE '^(현황판 갱신|.*수리|.*고친|.*고쳤|.*막는다|.*해결)' || true)
            NNEW=$(if [ -z "$NEW" ]; then echo 0; else echo "$NEW" | wc -l; fi)
            if [ "$NNEW" -eq 0 ]; then
              echo "오늘은 새로 들어간 것이 없습니다."
            else
              echo "**${NNEW}건**이 새로 들어갔습니다."
              echo
              echo "$NEW" | sed 's/^/- /'
            fi
            echo
            echo "### 오늘 목표 대비"
            echo
            echo "| 항목 | 오늘 | 목표 |"
            echo "|---|---|---|"
            echo "| 고친 것 | ${NFIX}건 | 10건 |"
            echo "| 새로 들어간 것 | ${NNEW}건 | 10건 |"
            echo
            if [ "$NFIX" -lt 10 ] || [ "$NNEW" -lt 10 ]; then
              echo "목표에 못 미쳤습니다. 숫자를 채우려고 없는 일을 만들지는 않습니다 —"
              echo "고칠 것이 없으면 없다고 적고, 무료 한도에 걸리면 그렇다고 적습니다."
            else
              echo "목표를 채웠습니다."
            fi
            echo
            echo "### 게임은 지금 이런 상태입니다"
            echo
            echo "봇 6대를 60초 동안 싸우게 해서 방금 직접 잰 값입니다."
            echo
            cat /tmp/game.md
            echo
            echo
            echo "격추와 사망 횟수가 비슷하면 정상입니다. 저절로 기울어진 각도는 0도여야 합니다."
            echo
            echo "### 직원 근무 상황"
            echo
            echo "| 직원 | 결과 | 마지막 근무 |"
            echo "|---|---|---|"
            gh run list --limit 40 --json conclusion,createdAt,workflowName \
              --jq 'group_by(.workflowName) | map(.[0])
                    | map(select(.workflowName != "keep-alive"))
                    | .[] | "| \(.workflowName) | \(if .conclusion=="success" then "정상" elif .conclusion=="failure" then "실패" elif .conclusion==null then "근무 중" else .conclusion end) | \(.createdAt[5:16] | sub("T";" ")) UTC |"'
            echo
            echo "### 아직 손대지 못한 것"
            echo
            IS=$(gh issue list --state open --limit 30 --json number,title,labels \
                 --jq '.[] | select([.labels[].name]
                      | any(. == "bughunt" or . == "perf" or . == "balance"
                            or . == "measure" or . == "정비불가"))
                      | "- #\(.number) \(.title)"' 2>/dev/null || true)
            if [ -z "$IS" ]; then
              echo "없습니다. 들어온 문제는 모두 처리했습니다."
            else
              echo "$IS"
            fi
            echo
            echo "---"
            echo
            echo "비서가 하루에 한 번 자동으로 씁니다. 직원별 자세한 측정값은"
            echo "저장소의 Actions 탭에서 해당 근무를 열면 볼 수 있습니다."
          } > /tmp/digest.md
          cat /tmp/digest.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 보고서를 올린다
        if: steps.guard.outputs.skip == 'no'
        run: |
          gh label create daily-report --color 0E8A16 --description "비서의 일일보고" 2>/dev/null || true
          gh issue create \
            --title "일일보고 — ${{ steps.guard.outputs.today }}" \
            --label daily-report --body-file /tmp/digest.md
        env:
          GH_TOKEN: ${{ github.token }}
