# 실력 균형 검사원 — 봇 세 등급을 3분간 싸우게 하고 전적을 봅니다.
#
# 등급마다 실력이 다른 것은 일부러 그렇게 만든 것입니다. 그래서 차이가
# 나는 것 자체는 문제가 아니고, 한 등급이 아예 싸우지도 못하는 경우만
# 문제로 봅니다.
name: 실력 균형 검사원

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["keep-alive"]
    types: [completed]
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  balance:
    name: 3분 전투 전적
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 등급별 전적을 잰다
        run: |
          cd server
          python - <<'PY'
          import random, collections
          random.seed(11)
          import game

          w=game.World("bal")
          for _ in range(9000): w.step(1/50); w.events.clear()   # 3분

          per=collections.defaultdict(lambda:[0,0])
          for p in w.planes.values():
              per[p.tier][0]+=p.kills; per[p.tier][1]+=p.deaths

          label={"rookie":"초보 (이글)","veteran":"숙련 (팰컨)","ace":"최상급 (플랭커)"}
          bad=[]
          L=["## 실력별 전적", "",
             "봇을 실력에 따라 세 등급으로 나눠 3분 동안 싸우게 한 결과입니다.", "",
             "| 등급 | 잡은 수 | 죽은 수 | 잡은 수 ÷ 죽은 수 |","|---|---|---|---|"]
          for t in ("rookie","veteran","ace"):
              k,d=per.get(t,[0,0])
              kd=f"{k/d:.2f}" if d else "—"
              L.append(f"| {label[t]} | {k}대 | {d}번 | {kd} |")
              if k==0 and d>=8:
                  bad.append(f"{label[t]} 편이 3분 동안 한 대도 못 잡고 {d}번 죽기만 했습니다. "
                             f"일방적으로 맞고만 있습니다.")
          L += ["",
                "등급마다 실력이 다른 것은 일부러 그렇게 만든 것이라, 차이가 나는 것 자체는 "
                "문제가 아닙니다. 한 등급이 아예 싸우지도 못할 때만 문제로 봅니다.",
                "", "## 이상한 점", ""]
          L += [f"- ⚠️ {b}" for b in bad] if bad else ["이상 없습니다. 세 등급 모두 제 몫을 하고 있습니다."]
          body="\n".join(L); print(body)
          open("/tmp/report.md","w",encoding="utf-8").write(body)
          open("/tmp/anomalies","w").write(str(len(bad)))
          PY
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 이상이 있을 때만 이슈를 올린다
        run: |
          N=$(cat /tmp/anomalies)
          [ "$N" -eq 0 ] && { echo "이상 없음 → 이슈를 만들지 않습니다"; exit 0; }
          if [ "$(gh issue list --label balance --state open --json number --jq length)" != "0" ]; then
            echo "같은 종류의 이슈가 이미 열려 있어 새로 만들지 않습니다"; exit 0
          fi
          gh label create balance --color 0E8A16 --description "실력 균형 경고" 2>/dev/null || true
          gh issue create --title "실력 균형 경고 ${N}건 — $(TZ=Asia/Seoul date '+%m월 %d일 %H:%M')" \
            --label balance --body-file /tmp/report.md
        env:
          GH_TOKEN: ${{ github.token }}
